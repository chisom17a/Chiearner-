<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - VTU Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar dashboard-nav">
    <div class="container">
      <div class="nav-brand">
        <h1>VTU Hub</h1>
      </div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <span class="icon">🏠</span>
          <span>Dashboard</span>
        </a>
        <a href="airtime.html" class="menu-item">
          <span class="icon">📱</span>
          <span>Buy Airtime</span>
        </a>
        <a href="data.html" class="menu-item">
          <span class="icon">📶</span>
          <span>Buy Data</span>
        </a>
        <a href="electricity.html" class="menu-item">
          <span class="icon">💡</span>
          <span>Electricity</span>
        </a>
        <a href="cabletv.html" class="menu-item">
          <span class="icon">📺</span>
          <span>Cable TV</span>
        </a>
        <a href="transactions.html" class="menu-item">
          <span class="icon">📊</span>
          <span>Transactions</span>
        </a>
        <a href="profile.html" class="menu-item active">
          <span class="icon">👤</span>
          <span>Profile</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h2>My Profile</h2>
        <p>Manage your account information</p>
      </div>

      <div class="profile-container">
        <div class="profile-section">
          <h3>Personal Information</h3>
          <form id="profileForm" class="profile-form">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required disabled>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required>
            </div>

            <div id="profileMessage" class="form-message"></div>

            <button type="submit" class="btn-primary">Update Profile</button>
          </form>
        </div>

        <div class="profile-section">
          <h3>Change Password</h3>
          <form id="passwordForm" class="profile-form">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" name="currentPassword" required>
            </div>

            <div class="form-group">
              <label for="newPassword">New Password</label>
              <input type="password" id="newPassword" name="newPassword" minlength="6" required>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm New Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <div id="passwordMessage" class="form-message"></div>

            <button type="submit" class="btn-primary">Change Password</button>
          </form>
        </div>

        <div class="profile-section">
          <h3>Account Statistics</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">0</div>
              <div class="stat-label">Total Transactions</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">₦0.00</div>
              <div class="stat-label">Total Spent</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="profile.js"></script>
</body>
</html>
