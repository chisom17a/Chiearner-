<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - VTU Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar dashboard-nav">
    <div class="container">
      <div class="nav-brand">
        <h1>VTU Hub</h1>
      </div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <span class="icon">🏠</span>
          <span>Dashboard</span>
        </a>
        <a href="airtime.html" class="menu-item">
          <span class="icon">📱</span>
          <span>Buy Airtime</span>
        </a>
        <a href="data.html" class="menu-item">
          <span class="icon">📶</span>
          <span>Buy Data</span>
        </a>
        <a href="electricity.html" class="menu-item">
          <span class="icon">💡</span>
          <span>Electricity</span>
        </a>
        <a href="cabletv.html" class="menu-item">
          <span class="icon">📺</span>
          <span>Cable TV</span>
        </a>
        <a href="transactions.html" class="menu-item active">
          <span class="icon">📊</span>
          <span>Transactions</span>
        </a>
        <a href="profile.html" class="menu-item">
          <span class="icon">👤</span>
          <span>Profile</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h2>Transaction History</h2>
        <p>View all your transactions</p>
      </div>

      <div class="transactions-container">
        <div class="transactions-filter">
          <select id="filterType" class="filter-select">
            <option value="all">All Transactions</option>
            <option value="airtime">Airtime</option>
            <option value="data">Data</option>
            <option value="electricity">Electricity</option>
            <option value="cabletv">Cable TV</option>
          </select>
        </div>

        <div class="transactions-table">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Details</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="transactionsBody">
              <tr>
                <td colspan="5" class="no-data">No transactions found</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="transactions.js"></script>
</body>
</html>
